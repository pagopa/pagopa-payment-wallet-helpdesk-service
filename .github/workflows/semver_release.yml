name: Make new release

on:
  push:
    branches: [ "main" ]

permissions: {}

jobs:
  semver_labels:
    name: Read semver labels from merged PR
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      issues: write
      contents: read
    outputs:
      semver_app: ${{ steps.semver_labels.outputs.semver_app }}
      semver_chart: ${{ steps.semver_labels.outputs.semver_chart }}
      skip_release: ${{ steps.semver_labels.outputs.skip_release }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/check-pr-semver-labels
        id: semver_labels
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  semver_update:
    if: ${{ needs.semver_labels.outputs.skip_release == 'False' }}
    name: Update semver for eligible files (Helm charts)
    runs-on: ubuntu-latest
    needs: semver_labels
    environment: prod
    permissions:
      contents: write
      pull-requests: write
    outputs:
      app_version: ${{ steps.get_new_ver.outputs.version }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git author
        run: |
          git config --global user.email "${{ vars.BOT_GIT_MAIL }}"
          git config --global user.name "${{ vars.BOT_GIT_USER }}"

      # Install semver CLI upfront
      - name: Setup Node.js & semver
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: '22'
      - name: Install semver globally
        run: npm install -g semver

      - name: Calculate New App Version
        id: get_new_ver
        run: |
          RELEASE_APP_SEMVER="${{ needs.semver_labels.outputs.semver_app }}"
          CHART_FILE="helm/Chart.yaml"
          
          # Read previous app version from Chart.yaml (fallback to 0.0.0 if empty/missing)
          CURRENT_APP_VERSION=$(yq -r '.appVersion // "0.0.0"' "$CHART_FILE")
          
          if [[ "$RELEASE_APP_SEMVER" != "ignore-for-release" && -n "$RELEASE_APP_SEMVER" ]]; then
            NEW_VERSION=$(semver "$CURRENT_APP_VERSION" -i "$RELEASE_APP_SEMVER")
          else
            NEW_VERSION="$CURRENT_APP_VERSION"
          fi
          
          echo "Calculated App Version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update Helm Version Values
        run: |
          for i in helm/values-*.yaml; do
            [ -f "$i" ] || break
            yq -i ".microservice-chart.image.tag = \"${{ steps.get_new_ver.outputs.version }}\"" "$i"
            git add "$i"
          done

      - name: Update Chart App Version
        run: |
          CHART_FILE="helm/Chart.yaml"
          if [[ -f "$CHART_FILE" ]]; then
            yq -i ".appVersion = \"${{ steps.get_new_ver.outputs.version }}\"" "$CHART_FILE"
            git add "$CHART_FILE"
          fi

      - name: Update Chart Version
        run: |
          RELEASE_CHART_SEMVER="${{ needs.semver_labels.outputs.semver_chart }}"
          CHART_FILE="helm/Chart.yaml"

          if [[ -f "$CHART_FILE" && -n "$RELEASE_CHART_SEMVER" ]]; then
            # Strips "chart-" from chart-patch, chart-minor, chart-major
            INCREMENT_TYPE=$(echo "$RELEASE_CHART_SEMVER" | cut -d'-' -f2)
            CURRENT_CHART_VERSION=$(yq -r '.version' "$CHART_FILE")
            NEW_CHART_VERSION=$(semver "$CURRENT_CHART_VERSION" -i "$INCREMENT_TYPE")
          
            yq -i ".version = \"$NEW_CHART_VERSION\"" "$CHART_FILE"
            git add "$CHART_FILE"
          fi

      - name: Push New Version
        run: |
          if ! git diff --cached --quiet; then
            git diff --cached
            git commit -m "Bump version [skip ci]"
            git push origin 'main'
          fi

  github_release:
    if: ${{ needs.semver_labels.outputs.skip_release == 'False' }}
    name: Create a New Github Release
    needs: semver_update
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout release branch
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: 'main'

      - name: Set Up Github Release
        id: setup_github_release
        run: |
          CHART_FILE="helm/Chart.yaml"
          chart_version=$(yq -r '.version' "$CHART_FILE")
          HEAD_SHA=$(git rev-parse HEAD)
          TAG="$chart_version"
          TITLE="Release $chart_version"
          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TITLE=$TITLE" >> $GITHUB_OUTPUT

      - name: Create New Github Release
        uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174 #v1.16.0
        with:
          commit: ${{ steps.setup_github_release.outputs.HEAD_SHA }}
          tag: ${{ steps.setup_github_release.outputs.TAG }}
          name: ${{ steps.setup_github_release.outputs.TITLE }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          makeLatest: true
          generateReleaseNotes: true
          draft: false
          prerelease: false